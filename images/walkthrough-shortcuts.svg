<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="12" fill="url(#bg)"/>
  <text x="200" y="30" font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="600">⌨️ Keyboard Shortcuts</text>
  <g transform="translate(30,48)">
    <rect width="340" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="6" width="90" height="22" rx="4" fill="#0e7490" opacity="0.4"/>
    <text x="53" y="22" font-family="monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Ctrl+Alt+M</text>
    <text x="120" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">New ModelPilot Chat</text>
  </g>
  <g transform="translate(30,90)">
    <rect width="340" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="6" width="90" height="22" rx="4" fill="#0e7490" opacity="0.4"/>
    <text x="53" y="22" font-family="monospace" font-size="10" fill="#06b6d4" text-anchor="middle">Ctrl+Alt+I</text>
    <text x="120" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Inline Chat (Edit Code)</text>
  </g>
  <g transform="translate(30,132)">
    <rect width="340" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="6" width="90" height="22" rx="4" fill="#3b82f6" opacity="0.4"/>
    <text x="53" y="22" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Ctrl+Alt+T</text>
    <text x="120" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Prompt Templates</text>
  </g>
  <g transform="translate(30,174)">
    <rect width="340" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="8" y="6" width="90" height="22" rx="4" fill="#3b82f6" opacity="0.4"/>
    <text x="53" y="22" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">Ctrl+Alt+R</text>
    <text x="120" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Refactor Selection</text>
  </g>
  <text x="200" y="232" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Right-click code for more actions: Explain, Fix, Review, Tests</text>
  <text x="200" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Search "ModelPilot" in Command Palette for all commands</text>
</svg>
